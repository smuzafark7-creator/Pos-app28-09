<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <!-- Outer Decorative Ring -->
  <circle cx="300" cy="300" r="280" stroke="#000000" stroke-width="2.5" stroke-opacity="0.9" />
  <circle cx="300" cy="300" r="268" stroke="#000000" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.7" />
  <circle cx="300" cy="300" r="256" stroke="#000000" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Surrounding Stars -->
  <g fill="#000000" stroke="none" fill-opacity="0.9">
    <!-- Top 5 Stars -->
    <polygon points="300,56 304,68 316,68 306,75 310,87 300,80 290,87 294,75 284,68 296,68" />
    <polygon points="260,65 263,74 272,74 265,79 268,88 260,83 252,88 255,79 248,74 257,74" transform="scale(0.8) translate(65, 18)" />
    <polygon points="340,65 343,74 352,74 345,79 348,88 340,83 332,88 335,79 328,74 337,74" transform="scale(0.8) translate(85, 18)" />
    
    <!-- Cardinal Compass Dots -->
    <circle cx="300" cy="36" r="4" />
    <circle cx="300" cy="564" r="4" />
    <circle cx="36" cy="300" r="4" />
    <circle cx="564" cy="300" r="4" />
  </g>

  <!-- Laurel Wreath Left -->
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
    <path d="M 180,440 C 130,380 130,220 180,160" />
    <!-- Leaves Left -->
    <path d="M 175,430 C 150,425 140,405 155,395 C 165,405 175,415 175,430 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 160,395 C 135,390 128,370 142,360 C 152,370 160,380 160,395 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 150,360 C 125,355 120,335 135,325 C 145,335 150,345 150,360 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 145,320 C 120,315 118,295 132,285 C 142,295 145,305 145,320 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 148,280 C 125,270 125,250 140,242 C 148,252 148,265 148,280 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 158,240 C 138,225 140,205 155,200 C 160,212 158,228 158,240 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 175,200 C 158,185 165,165 180,165 C 182,178 178,190 175,200 Z" fill="#000000" fill-opacity="0.25" />
  </g>

  <!-- Laurel Wreath Right -->
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
    <path d="M 420,440 C 470,380 470,220 420,160" />
    <!-- Leaves Right -->
    <path d="M 425,430 C 450,425 460,405 445,395 C 435,405 425,415 425,430 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 440,395 C 465,390 472,370 458,360 C 448,370 440,380 440,395 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 450,360 C 475,355 480,335 465,325 C 455,335 450,345 450,360 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 455,320 C 480,315 482,295 468,285 C 458,295 455,305 455,320 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 452,280 C 475,270 475,250 460,242 C 452,252 452,265 452,280 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 442,240 C 462,225 460,205 445,200 C 440,212 442,228 442,240 Z" fill="#000000" fill-opacity="0.25" />
    <path d="M 425,200 C 442,185 435,165 420,165 C 418,178 422,190 425,200 Z" fill="#000000" fill-opacity="0.25" />
  </g>

  <!-- Chef Hat (Toque) at Center Top -->
  <g stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95">
    <!-- Hat Puffs -->
    <path d="M 240,205 C 220,200 215,165 240,150 C 240,120 280,115 300,135 C 320,115 360,120 360,150 C 385,165 380,200 360,205" fill="#000000" fill-opacity="0.12" />
    <!-- Hat Pleats Vertical Details -->
    <path d="M 265,150 C 265,175 260,205 260,205" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 300,135 C 300,170 300,205 300,205" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 335,150 C 335,175 340,205 340,205" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Hat Band -->
    <rect x="238" y="205" width="124" height="24" rx="4" fill="#000000" fill-opacity="0.2" />
    <line x1="248" y1="217" x2="352" y2="217" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Crossed Fork & Chef Knife -->
  <g stroke="#000000" stroke-width="2.5" fill="#000000" fill-opacity="0.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95">
    <!-- Knife (diagonal left-top to right-bottom) -->
    <g transform="rotate(45 300 300)">
      <!-- Blade -->
      <path d="M 294,140 Q 306,170 306,260 L 294,260 Z" />
      <!-- Bolster -->
      <rect x="291" y="260" width="18" height="8" rx="2" />
      <!-- Handle -->
      <rect x="293" y="268" width="14" height="90" rx="4" />
      <circle cx="300" cy="285" r="2.5" fill="#000000" />
      <circle cx="300" cy="315" r="2.5" fill="#000000" />
      <circle cx="300" cy="345" r="2.5" fill="#000000" />
    </g>

    <!-- Fork (diagonal right-top to left-bottom) -->
    <g transform="rotate(-45 300 300)">
      <!-- Prongs -->
      <path d="M 288,140 L 288,195 Q 288,225 300,235 Q 312,225 312,195 L 312,140" fill="none" />
      <line x1="296" y1="140" x2="296" y2="195" />
      <line x1="304" y1="140" x2="304" y2="195" />
      <!-- Stem and Handle -->
      <path d="M 300,235 L 300,268" />
      <rect x="293" y="268" width="14" height="90" rx="4" />
      <circle cx="300" cy="285" r="2.5" fill="#000000" />
      <circle cx="300" cy="315" r="2.5" fill="#000000" />
      <circle cx="300" cy="345" r="2.5" fill="#000000" />
    </g>
  </g>

  <!-- Serving Cloche Dome & Platter -->
  <g stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95">
    <!-- Steam Swirls Above Cloche -->
    <path d="M 285,275 C 280,265 290,255 285,245" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 300,270 C 295,260 305,250 300,240" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 315,275 C 310,265 320,255 315,245" stroke-width="1.5" stroke-opacity="0.7" />
    
    <!-- Central Cloche Platter Overlay -->
    <ellipse cx="300" cy="335" rx="72" ry="12" fill="#000000" fill-opacity="0.25" stroke-width="2.5" />
    <path d="M 242,335 C 242,295 358,295 358,335 Z" fill="#000000" fill-opacity="0.15" stroke-width="2.5" />
    <!-- Cloche Handle -->
    <circle cx="300" cy="290" r="6" fill="#000000" fill-opacity="0.5" stroke-width="2" />
  </g>

  <!-- Decorative Ribbon Banner at Bottom -->
  <g stroke="#000000" stroke-width="2" fill="none" stroke-opacity="0.95">
    <path d="M 180,455 L 205,445 L 395,445 L 420,455 L 405,475 L 395,465 L 205,465 L 195,475 Z" fill="#000000" fill-opacity="0.2" />
    <!-- Banner Ribbons Ends -->
    <path d="M 180,455 L 205,465 L 205,445" />
    <path d="M 420,455 L 395,465 L 395,445" />
  </g>

  <!-- Typography / Inscriptions -->
  <g fill="#000000" stroke="none" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700">
    <text x="300" y="459" font-size="12" letter-spacing="4" fill-opacity="0.95">FINE DINING &amp; POS</text>
    <text x="300" y="390" font-size="12" letter-spacing="2.5" fill-opacity="0.9">BILAAL RESTAURANT</text>
    <text x="300" y="410" font-size="9" letter-spacing="2" fill-opacity="0.7">EST. 2024</text>
  </g>
</svg>
